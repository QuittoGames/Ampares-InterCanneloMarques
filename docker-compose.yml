# =============================================================================
# docker-compose.yml
#
# Só cria o container PostgreSQL local — MESMA spec de
# scripts/setup_postgres_docker.sh (§1.3/§1.6), MAS SEM schema, migrations,
# dump ou seed. Apenas o create do banco (POSTGRES_DB) e o healthcheck.
#
# Config lida do .env da raiz (docker compose faz interpolação automática
# do arquivo .env do diretório do projeto — nunca `source`, nunca hardcoded):
#   * DB_USER      -> POSTGRES_USER   (mesmo valor que o script lê do .env)
#   * DB_PASSWORD  -> POSTGRES_PASSWORD
#   * DATABASE     -> POSTGRES_DB     (default: neondb, igual à URL JDBC)
#   * DB_PORT      -> porta publicada no host (default: 5432)
#
# Nomes idênticos ao script:
#   container: neondb-local | volume: neondb_local_data | imagem: postgres:18
#
# Uso:
#   docker compose up -d          # cria/sobe o container (idempotente)
#   docker compose down           # para e remove o container (volume MANTIDO)
#   docker compose down -v        # DESTRUTIVO: remove também o volume (dados)
#
# ORDEM DE USO: mesmo aviso do script — o application.properties usa
# spring.jpa.hibernate.ddl-auto=update; se o Spring subir primeiro ele pode
# criar colunas divergentes do schema canônico.
# =============================================================================
services:
  db:
    image: postgres:18
    container_name: neondb-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE:-neondb}
      POSTGRES_USER: ${DB_USER:?DB_USER não definido — adicione 'DB_USER=<valor>' ao .env da raiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definido — adicione 'DB_PASSWORD=<valor>' ao .env da raiz}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - neondb_local_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  # Volume pré-existente (criado pelo setup script ou por execução anterior):
  # external=true impede que o compose o crie/gerencie/apague — dados ficam
  # sob responsabilidade do script (docker volume rm neondb_local_data).
  neondb_local_data:
    name: neondb_local_data
    external: true
